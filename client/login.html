<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SmartResolve AI</title>
  <meta name="description" content="Login to SmartResolve AI customer support system.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233d7fff'/><text y='22' x='6' font-size='18' font-family='sans-serif' fill='white' font-weight='bold'>S</text></svg>">
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .login-wrapper {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: var(--space-8) var(--space-6);
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border-default);
      border-radius: var(--radius-xl); padding: var(--space-10);
      width: 100%; max-width: 420px; box-shadow: var(--shadow-lg);
    }
    .login-logo {
      display: flex; align-items: center; gap: var(--space-3);
      margin-bottom: var(--space-8);
    }
    .login-logo-icon {
      width: 40px; height: 40px; background: var(--accent-primary); border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .login-logo-text { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
    .login-title { font-size: 1.4rem; font-weight: 700; margin-bottom: var(--space-2); }
    .login-sub  { font-size: 0.875rem; color: var(--text-muted); margin-bottom: var(--space-8); }
    .login-form { display: flex; flex-direction: column; gap: var(--space-5); }
    .login-actions { margin-top: var(--space-2); }
    .login-btn { width: 100%; }
    .login-divider {
      display: flex; align-items: center; gap: var(--space-3); margin: var(--space-4) 0;
    }
    .login-divider hr { flex: 1; border: none; border-top: 1px solid var(--border-subtle); }
    .login-divider span { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
    .demo-accounts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .demo-btn {
      background: var(--bg-elevated); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
      text-align: left; cursor: pointer; transition: all var(--transition-fast);
    }
    .demo-btn:hover { border-color: var(--accent-primary); background: var(--accent-subtle); }
    .demo-btn-role { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent-primary); margin-bottom: 2px; }
    .demo-btn-name { font-size: 0.8rem; font-weight: 500; color: var(--text-primary); }
    .demo-btn-email { font-size: 0.75rem; color: var(--text-muted); }
    .error-alert { display: none; }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">S</div>
      <span class="login-logo-text">SmartResolve AI</span>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="login-sub">Access the support system with your account credentials.</p>

    <div id="error-alert" class="alert alert-danger error-alert" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="error-text">Invalid credentials.</span>
    </div>

    <form class="login-form" id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        <span class="form-error" id="email-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
        <span class="form-error" id="password-error"></span>
      </div>
      <div class="login-actions">
        <button class="btn btn-primary login-btn btn-lg" type="submit" id="login-btn">
          <span id="login-btn-text">Sign in</span>
          <span id="login-spinner" class="spinner" style="display:none;"></span>
        </button>
      </div>
    </form>

    <div class="login-divider">
      <hr><span>Or sign in with a demo account</span><hr>
    </div>

    <div class="demo-accounts">
      <button class="demo-btn" onclick="fillDemo('rahul@example.com', 'password123', 'Customer')" id="demo-customer-btn">
        <div class="demo-btn-role">Customer</div>
        <div class="demo-btn-name">Rahul Sharma</div>
        <div class="demo-btn-email">rahul@example.com</div>
      </button>
      <button class="demo-btn" onclick="fillDemo('priya@smartresolve.ai', 'password123', 'Agent')" id="demo-agent-btn">
        <div class="demo-btn-role">Support Agent</div>
        <div class="demo-btn-name">Priya Patel</div>
        <div class="demo-btn-email">priya@smartresolve.ai</div>
      </button>
      <button class="demo-btn" onclick="fillDemo('admin@smartresolve.ai', 'password123', 'Admin')" id="demo-admin-btn" style="grid-column: 1/-1;">
        <div class="demo-btn-role">Admin</div>
        <div class="demo-btn-name">Admin User</div>
        <div class="demo-btn-email">admin@smartresolve.ai</div>
      </button>
    </div>

    <div style="margin-top: var(--space-6); text-align:center; font-size:0.8rem; color:var(--text-muted);">
      <a href="index.html">Back to home</a>
    </div>
  </div>
</div>

<script src="scripts/utils.js"></script>
<script>
  // Redirect if already logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (Auth.isLoggedIn()) {
      redirectByRole(Auth.getUser()?.role);
    }
  });

  function redirectByRole(role) {
    if (role === 'agent')  { window.location.href = 'agent-dashboard.html'; return; }
    if (role === 'admin')  { window.location.href = 'admin.html'; return; }
    window.location.href = 'customer.html';
  }

  function fillDemo(email, password, role) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
    document.getElementById('email').focus();
  }

  function showError(msg) {
    const el = document.getElementById('error-alert');
    document.getElementById('error-text').textContent = msg;
    el.style.display = 'flex';
  }
  function hideError() {
    document.getElementById('error-alert').style.display = 'none';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Validation
    let valid = true;
    if (!email) {
      document.getElementById('email-error').textContent = 'Email is required.';
      valid = false;
    } else {
      document.getElementById('email-error').textContent = '';
    }
    if (!password) {
      document.getElementById('password-error').textContent = 'Password is required.';
      valid = false;
    } else {
      document.getElementById('password-error').textContent = '';
    }
    if (!valid) return;

    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('login-btn-text');
    const spinner = document.getElementById('login-spinner');
    btn.disabled = true;
    btnText.textContent = 'Signing in...';
    spinner.style.display = 'inline-block';

    try {
      const res = await Api.post('/auth/login', { email, password }, false);
      Auth.setSession(res.token, res.user);
      Toast.success('Signed in successfully');
      setTimeout(() => redirectByRole(res.user?.role), 400);
    } catch (err) {
      showError(err.message || 'Invalid email or password.');
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Sign in';
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
